<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un cadeau pour toi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-top: #12062f;
      --bg-bottom: #2e0832;
      --gold: #ffd166;
      --gold-dark: #c9963a;
      --cream: #fff7ea;
      --ink: #2b1e1e;
      --box-color: #1c0a3a;
      --box-border: rgba(255, 209, 102, 0.55);
      --ribbon: #ffd166;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Cormorant Garamond", serif;
      color: var(--cream);
      background: radial-gradient(circle at 50% 0%, #31125f 0%, var(--bg-top) 40%, var(--bg-bottom) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 2.5rem;
      padding: 2rem 1rem;
    }

    /* ── Stars ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--d, 4s) var(--delay, 0s) infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: var(--bright, 0.7); transform: scale(1); }
    }

    /* ── Layout ── */
    .scene {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .title {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.3px;
      text-align: center;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* ── Box ── */
    .box-stage {
      perspective: 900px;
      perspective-origin: 50% 30%;
    }

    .gift-box {
      position: relative;
      width: 200px;
      cursor: pointer;
      user-select: none;
    }

    /* LID */
    .box__lid {
      position: relative;
      width: 216px;
      height: 60px;
      left: -8px;
      background: var(--box-color);
      border: 2px solid var(--box-border);
      border-radius: 6px 6px 0 0;
      transform-origin: top center;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.9s ease;
      box-shadow: 0 -4px 20px rgba(255, 209, 102, 0.12), inset 0 -4px 14px rgba(0,0,0,0.3);
      z-index: 2;
    }

    /* ribbon stripe on lid */
    .box__lid::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      bottom: 0;
      width: 28px;
      background: var(--ribbon);
      opacity: 0.9;
      transition: opacity 0.4s ease;
    }

    /* BOW */
    .bow {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 32px;
      z-index: 3;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .bow__loop {
      position: absolute;
      width: 28px;
      height: 18px;
      border-radius: 50%;
      background: var(--ribbon);
      top: 6px;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25);
    }
    .bow__loop--left {
      left: 0;
      transform: rotate(-30deg);
      transform-origin: right center;
    }
    .bow__loop--right {
      right: 0;
      transform: rotate(30deg);
      transform-origin: left center;
    }
    .bow__knot {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      z-index: 1;
    }
    .bow__tail {
      position: absolute;
      width: 12px;
      height: 20px;
      background: var(--ribbon);
      bottom: -14px;
      border-radius: 0 0 4px 4px;
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.2);
    }
    .bow__tail--left {
      left: calc(50% - 10px);
      transform: rotate(-12deg);
      transform-origin: top center;
    }
    .bow__tail--right {
      left: calc(50% + 0px);
      transform: rotate(12deg);
      transform-origin: top center;
    }

    /* BODY */
    .box__body {
      position: relative;
      width: 200px;
      height: 170px;
      background: var(--box-color);
      border: 2px solid var(--box-border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,209,102,0.06);
      overflow: hidden;
    }

    /* ribbon stripe on body */
    .box__body::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      bottom: 0;
      width: 28px;
      background: var(--ribbon);
      opacity: 0.9;
      transition: opacity 0.4s ease;
    }

    /* Glow from inside when open */
    .box__glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,209,102,0.18) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 1s ease 0.5s;
      pointer-events: none;
    }

    /* ── Inside content ── */
    .box__inside {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.2rem 1rem;
      gap: 0.6rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease 1.1s, transform 0.6s ease 1.1s;
      z-index: 1;
    }
    .box__inside .heart {
      font-size: 2rem;
    }
    .box__inside .inner-text {
      font-family: "Patrick Hand", cursive;
      font-size: 1.05rem;
      color: var(--gold);
      text-align: center;
      line-height: 1.4;
    }

    /* ── Hint ── */
    .hint {
      font-size: 1.1rem;
      color: rgba(255, 247, 234, 0.6);
      letter-spacing: 0.3px;
      transition: opacity 0.5s ease;
      text-align: center;
    }

    /* ── Message card (appears after open) ── */
    .message-card {
      width: min(520px, 90vw);
      background: #fff;
      border-radius: 20px;
      padding: 1.4rem 1.6rem;
      color: var(--ink);
      box-shadow: 0 24px 50px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.7s ease, transform 0.7s ease;
      pointer-events: none;
    }
    .message-card p {
      font-family: "Patrick Hand", cursive;
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
      line-height: 1.4;
      color: #201527;
    }
    .message-card .card-hint {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: #7a5a8a;
      text-align: right;
    }

    .next-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      color: #1b1226;
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      background: linear-gradient(90deg, #ffcf8f 0%, #ffd166 45%, #ff9ed0 100%);
      box-shadow: 0 12px 28px rgba(0,0,0,0.3);
      transition: transform 180ms ease, box-shadow 180ms ease;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }
    .next-button:hover { transform: translateY(-2px) scale(1.02); }

    /* ── STATES ── */
    .gift-box.untying .bow,
    .gift-box.untying .box__lid::after,
    .gift-box.untying .box__body::before {
      opacity: 0;
      transform: translateX(-50%) translateY(8px);
    }
    .gift-box.untying .bow {
      opacity: 0;
      transform: translateX(-50%) translateY(-12px) rotate(20deg);
    }

    .gift-box.opening .box__lid {
      transform: rotateX(-140deg);
      opacity: 0.2;
    }

    .gift-box.open .box__glow {
      opacity: 1;
    }
    .gift-box.open .box__inside {
      opacity: 1;
      transform: translateY(0);
    }

    .visible {
      opacity: 1 !important;
      transform: translateY(0) !important;
      pointer-events: auto !important;
    }

    /* ── Particles ── */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      border-radius: 50%;
      animation: particleFly var(--dur) ease-out forwards;
    }
    @keyframes particleFly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* ── Nav ── */
    .return-button {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--cream);
      background: rgba(10,7,24,0.46);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 20px rgba(0,0,0,0.26);
      backdrop-filter: blur(10px);
      transition: transform 180ms ease, background 180ms ease;
    }
    .return-button:hover { transform: translateY(-1px); background: rgba(10,7,24,0.7); }

    @media (max-width: 500px) {
      .gift-box { transform: scale(0.88); }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <a class="return-button" href="gift.html">← Retour</a>

  <div class="scene">
    <h1 class="title">Un petit cadeau pour toi ✨</h1>

    <div class="box-stage">
      <div class="gift-box" id="giftBox" tabindex="0" role="button" aria-label="Ouvrir le cadeau">

        <div class="bow">
          <div class="bow__loop bow__loop--left"></div>
          <div class="bow__loop bow__loop--right"></div>
          <div class="bow__knot"></div>
          <div class="bow__tail bow__tail--left"></div>
          <div class="bow__tail bow__tail--right"></div>
        </div>

        <div class="box__lid" id="boxLid"></div>

        <div class="box__body">
          <div class="box__glow"></div>
          <div class="box__inside">
            <span class="heart">💛</span>
            <p class="inner-text">Pour toi,<br>mon amour</p>
          </div>
        </div>

      </div>
    </div>

    <p class="hint" id="hint">Clique pour ouvrir ✨</p>

    <div class="message-card" id="messageCard">
      <p id="messageText"></p>
      <p class="card-hint" id="cardHint">Lis le message...</p>
    </div>

    <a class="next-button" id="nextButton" href="wheel.html">La suite → 🎡</a>
  </div>

  <script>
    // ── Stars ──
    const starsEl = document.getElementById("stars");
    for (let i = 0; i < 80; i++) {
      const s = document.createElement("div");
      s.className = "star";
      const size = Math.random() * 2.5 + 0.8;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%; top:${Math.random()*100}%;
        --d:${3+Math.random()*5}s;
        --delay:${Math.random()*6}s;
        --bright:${0.4+Math.random()*0.6};
      `;
      starsEl.appendChild(s);
    }

    // ── Box logic ──
    const box    = document.getElementById("giftBox");
    const hint   = document.getElementById("hint");
    const card   = document.getElementById("messageCard");
    const msgEl  = document.getElementById("messageText");
    const cardHint = document.getElementById("cardHint");
    const nextBtn  = document.getElementById("nextButton");

    const message = "Voilà un cadeau que la distance ne peut pas t'enlever : savoir que tu es aimée, chaque jour, chaque heure, même à des milliers de kilomètres. Joyeux anniversaire mon amour. 🌙";

    let opened = false;

    function spawnParticles() {
      const rect = box.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 3;
      const colors = ["#ffd166","#ff9ed0","#c084fc","#ffffff","#ffcf8f"];

      for (let i = 0; i < 40; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const size = 4 + Math.random() * 7;
        const angle = Math.random() * Math.PI * 2;
        const dist = 80 + Math.random() * 200;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 60;
        const dur = 0.7 + Math.random() * 0.8;

        p.style.cssText = `
          left:${cx}px; top:${cy}px;
          width:${size}px; height:${size}px;
          background:${colors[Math.floor(Math.random()*colors.length)]};
          --tx:${tx}px; --ty:${ty}px; --dur:${dur}s;
        `;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), dur * 1000 + 100);
      }
    }

    function typeMessage(text, el, onDone) {
      let i = 0;
      el.textContent = "";
      const timer = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) {
          clearInterval(timer);
          if (onDone) onDone();
        }
      }, 28);
    }

    function openBox() {
      if (opened) return;
      opened = true;

      hint.style.opacity = "0";
      box.style.cursor = "default";

      // Phase 1 : untie
      box.classList.add("untying");

      // Phase 2 : open lid
      setTimeout(() => {
        box.classList.add("opening");
        spawnParticles();
      }, 500);

      // Phase 3 : fully open, show content
      setTimeout(() => {
        box.classList.add("open");
      }, 1200);

      // Phase 4 : reveal message card
      setTimeout(() => {
        card.classList.add("visible");
        typeMessage(message, msgEl, () => {
          cardHint.textContent = "✓";
          setTimeout(() => {
            nextBtn.classList.add("visible");
          }, 600);
        });
      }, 2000);
    }

    box.addEventListener("click", openBox);
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBox(); }
    });
  </script>
</body>
</html>
